header{width:min(100% - 36px,980px);margin:auto;padding:22px 0;display:flex;align-items:center;justify-content:center}

.tag{margin:22px auto 28px;color:#ead7ff;font-size:14px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 25px;border-radius:12px;background:linear-gradient(135deg,#f7d98f,#d9a640);color:#1b1122;text-decoration:none;font-weight:800;box-shadow:0 8px 28px #d9a64030;transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.note{font-size:12px;margin-top:16px;color:#9d93aa}
footer{text-align:center;padding:18px;color:#82798e;font-size:11px}
@media(max-width:480px){header{padding:18px 0}.logo{width:68px;height:68px}main{padding:18px 0 44px}p{font-size:14px}.cta{width:100%;max-width:340px}}
