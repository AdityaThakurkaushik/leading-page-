<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090611">
<meta name="description" content="MILLIONAIRE HUB Referral Manager से जुड़ने के लिए Telegram पर संपर्क करें।">
<title>MILLIONAIRE HUB | Referral Manager</title>
<style>
:root{color-scheme:dark;--gold:#e9bd62;--purple:#8b55d8;--muted:#c7bfd2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#2b1745 0,transparent 48%),#09070e;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column}
.page-link{position:fixed;inset:0;z-index:1}
header{width:min(100% - 36px,980px);margin:auto;padding:22px 0;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;pointer-events:none}
.logo{width:228px;height:228px;border-radius:50%;object-fit:contain;border:3px solid var(--gold);box-shadow:0 0 30px #dcae5160;background:#171020}
main{width:min(100% - 36px,760px);margin:auto;flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 0 48px;position:relative;z-index:2;pointer-events:none}
.content{width:100%}
.kicker{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700}
h1{font-family:Georgia,serif;font-size:clamp(36px,8vw,60px);line-height:1.08;margin:16px 0}
h1 span{color:var(--gold)}
p{color:var(--muted);font-size:16px;line-height:1.7;max-width:530px;margin:0 auto}
.tag{margin:18px auto 25px;color:#ead7ff;font-size:14px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,440px);min-height:58px;margin:0 auto;padding:16px 28px;border-radius:12px;background:linear-gradient(135deg,#f7d98f,#d9a640);color:#1b1122;text-decoration:none;font-weight:800;font-size:16px;box-shadow:0 8px 28px #d9a64030;position:relative;z-index:3;pointer-events:auto;transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.note{font-size:12px;margin-top:16px;color:#9d93aa}
footer{text-align:center;padding:18px;color:#82798e;font-size:11px;position:relative;z-index:2;pointer-events:none}
@media(max-width:480px){header{padding:18px 0}.logo{width:204px;height:204px}main{padding:14px 0 36px}p{font-size:14px}.cta{width:100%;max-width:440px;min-height:60px}}
</style>
</head>
<body>
<a class="page-link" href="https://t.me/MillionaireHub_support" target="_blank" rel="noopener noreferrer" aria-label="Open Millionaire Hub Telegram support"></a>
<header><img class="logo" src="./assets/millionaire-hub-logo.webp" alt="MILLIONAIRE HUB Logo"></header>
<main>
<div class="content">
<div class="kicker">MILLIONAIRE HUB</div>
<h1>बनें हमारे <span>Referral Manager</span></h1>
<p>अपना Referral Manager Login प्राप्त करें और अपना सफर शुरू करें।</p>
<div class="tag">आपका अपना बिज़नेस</div>
<a class="cta" href="https://t.me/MillionaireHub_support" target="_blank" rel="noopener noreferrer">✈ Telegram पर संपर्क करें</a>
<div class="note">Telegram पर मैसेज करें और जानकारी प्राप्त करें।</div>
</div>
</main>
<footer>© 2026 MILLIONAIRE HUB</footer>
</body>
</html>
